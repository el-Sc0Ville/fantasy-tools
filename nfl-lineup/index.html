html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);overscroll-behavior-y:none}

.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.puck{width:22px;height:22px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#3a4656,#0b0f14 70%);box-shadow:0 0 0 2px var(--acc) inset}

.week{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.week .nav{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:17px;color:var(--acc);font-weight:800}
.week .mid{flex:1;text-align:center}
.week .mid i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dimmer)}
.week .mid b{font-size:16px}
.days{display:grid;gap:4px;margin:8px 0 10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 0;text-align:center}
.day i{display:block;font-style:normal;font-size:9.5px;color:var(--dimmer);font-weight:700;letter-spacing:.05em}
.day b{font-size:13px}
.day.light b{color:var(--good)} .day.heavy b{color:var(--warn)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.card>h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.085em;color:var(--dim);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2);display:flex;gap:8px;align-items:center;font-weight:650}
.card>h2 em{font-style:normal;font-size:10.5px;color:var(--dimmer);text-transform:none;letter-spacing:0;margin-left:auto;font-weight:450;text-align:right}
.pad{padding:11px 12px}
.note{font-size:12.5px;color:var(--dim);line-height:1.55} .note b{color:var(--tx)}
.sub{color:var(--dimmer);font-size:11px}
.up{color:var(--good)} .down{color:var(--bad)} .wn{color:var(--warn)}
.hero{padding:13px;background:radial-gradient(120% 100% at 0% 0%,rgba(92,200,255,.14),transparent 62%),var(--panel)}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero .lbl{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:750}
.grp{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);font-weight:750;padding:8px 12px 4px;border-top:1px solid #1a2431}
.row{display:flex;align-items:center;gap:9px;padding:8px 12px;border-top:1px solid #1a2431;cursor:pointer}
.row .body{flex:1;min-width:0}
.row .t{display:block;font-size:14px;font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:11px;color:var(--dimmer);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .gm{flex:none;text-align:center;min-width:34px}
.row .gm b{display:block;font-size:19px;font-weight:800;line-height:1}
.row .gm i{font-style:normal;font-size:9px;color:var(--dimmer);letter-spacing:.06em}
.row .dl{flex:none;text-align:right;min-width:62px;font-size:12px}
.row.close{background:linear-gradient(90deg,rgba(240,180,60,.10),transparent 70%)}
.row.out{opacity:.5}
.dots{display:flex;gap:3px;margin-top:4px}
.dot{width:12px;height:12px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}
.dot.on{background:var(--acc);border-color:var(--acc)} .dot.b2b{background:var(--warn);border-color:var(--warn)}
.dot.half{background:linear-gradient(90deg,var(--acc) 50%,var(--bg) 50%);border-color:var(--acc)}
.pos{display:inline-block;min-width:22px;text-align:center;font-size:10px;font-weight:800;padding:2px 5px;border-radius:5px;margin-right:4px;vertical-align:1px}
.F{background:rgba(180,140,255,.17);color:var(--f)} .D{background:rgba(245,158,91,.17);color:var(--d)} .G{background:rgba(255,111,145,.17);color:var(--g)}
.tag{font-size:10px;font-weight:750;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:1px}
.tag.bad{background:#3a1515;color:#ffadad} .tag.wn{background:#3a2a0c;color:#ffd894} .tag.new{background:#0d2536;color:#bfe9ff}

.cats .cn{min-width:92px;display:flex;align-items:center;gap:6px}
.emph{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--dimmer);min-width:44px}
.emph.push{color:#04131d;background:var(--acc);border-color:var(--acc)} .emph.punt{color:#ffadad;border-color:#4a2424;background:#2a1010}

.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.track .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.btn{padding:9px 12px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--dim)}

#toast.on{opacity:1;transform:translate(-50%,0)}

function scorePlayer(st, sc, pos, pr, pure){
  pr=pr||{};

     so st.gp cannot be trusted for DEF — use the season length instead. */

  for(const k in sc){
    const w=sc[k]; if(!w) continue;
    if(!pure && MODELED.has(k)) continue;
    const v=st[k]; if(v==null) continue;
    add(k,w*v);
  }
  if(pure) return {pts,bd};

  if(sc.fum && st.fum_lost) add('Fumbles (modelled)', sc.fum*st.fum_lost*M.fumPerLost);
  if(sc.pass_sack && st.pass_att)
    add('Sacks taken (modelled)', sc.pass_sack*st.pass_att*(pr.s!=null?pr.s:M.leagueSack));
  if(sc.pass_cmp_40p && st.pass_cmp)
    add('40+ yd completions', sc.pass_cmp_40p*st.pass_cmp*M.cmp40pPer100/100*(pr.d||1));
  if(sc.rush_40p && st.rush_att)
    add('40+ yd runs', sc.rush_40p*st.rush_att*M.rush40pPer100/100*(pr.b||1));

  /* Long-TD bonuses. _40p and _50p overlap, so a 50+ yard TD collects both. */
  const tdBonus=(tdStat, kind, mult, label)=>{
    const n=st[tdStat]; if(!n) return;
    const sh=M.tdShare[kind];
    if(sc[kind+'_td_40p']) add(label+' 40+ TD bonus', sc[kind+'_td_40p']*n*sh.p40*mult);
    if(sc[kind+'_td_50p']) add(label+' 50+ TD bonus', sc[kind+'_td_50p']*n*sh.p50*mult);
  };
  tdBonus('pass_td','pass',(pr.d||1),'Pass');
  tdBonus('rush_td','rush',(pr.b||1),'Rush');
  tdBonus('rec_td','rec',1,'Rec');

  if(sc.bonus_rush_yd_100) add('100-yd rush games', sc.bonus_rush_yd_100*gp*pGame(st.rush_yd,gp,100,'rush',1));
  if(sc.bonus_rush_yd_200) add('200-yd rush games', sc.bonus_rush_yd_200*gp*pGame(st.rush_yd,gp,200,'rush',M.tail.rush200));
  if(sc.bonus_rec_yd_100)  add('100-yd rec games',  sc.bonus_rec_yd_100*gp*pGame(st.rec_yd,gp,100,'rec',1));
  if(sc.bonus_rec_yd_200)  add('200-yd rec games',  sc.bonus_rec_yd_200*gp*pGame(st.rec_yd,gp,200,'rec',M.tail.rec200));
  if(sc.bonus_pass_yd_300) add('300-yd pass games', sc.bonus_pass_yd_300*gp*pGame(st.pass_yd,gp,300,'pass',1));
  if(sc.bonus_pass_yd_400) add('400-yd pass games', sc.bonus_pass_yd_400*gp*pGame(st.pass_yd,gp,400,'pass',M.tail.pass400));

       of real FG volume and omit short attempts entirely. Short makes are therefore
       inferred from the kicker's 2025 short:long ratio, shrunk toward the league's 1.04. */
    const long_=(st.fgm_40_49||0)+(st.fgm_50p||0);
    const ratio = pr.kr!=null ? pr.kr : M.kShortRatio;
    const shortMade = long_*ratio;
    const w=((sc.fgm_0_19||0)+(sc.fgm_20_29||0)+(sc.fgm_30_39||0))/3;
    add('FGs under 40 (inferred)', shortMade*(w||3));
    const miss=shortMade/(1-M.kShortMissRate)*M.kShortMissRate;
    const mw=((sc.fgmiss_0_19||0)+(sc.fgmiss_20_29||0)+(sc.fgmiss_30_39||0))/3;
    if(mw) add('Missed short FGs', miss*mw);
    if(sc.fgmiss) add('Missed FGs', miss*sc.fgmiss);
    /* fgm_50p is a SUPERSET of fgm_50_59 (verified: 50_59 + 60p = 50p in 2025 actuals),
       so if both are scored, a 50-59 yd make collects both values. */
    if(sc.fgm_50_59 && st.fgm_50p) add('50-59 yd FGs (inferred)', sc.fgm_50_59*st.fgm_50p*M.fg5059Share);
    if(sc.fgm_60p && st.fgm_50p)   add('60+ yd FGs (inferred)',   sc.fgm_60p*st.fgm_50p*(1-M.fg5059Share));
  }

  if(pos==='DEF'){
    if(sc.ff && st.fum_rec) add('Forced fumbles (modelled)', sc.ff*st.fum_rec*M.defFfPerFumRec);
    /* Pressure: not projected by Sleeper, so taken from 2025 team rates regressed to the mean.

    if(sc.qb_hit && pr.qh)   add('QB hits (modelled)',        sc.qb_hit*pr.qh*gp);

  if(pos==='DEF'&&e.stats&&e.stats.pts_allow==null) mu=Math.max(mu,0);
  const inj=pl.injury_status;
  if(!g){ mu=0; why='bye'; }
  else if(inj&&/^(Out|IR|PUP|Sus|NA|COV)/i.test(inj)){ mu=0; why=inj.toLowerCase(); }
  else if(inj&&/^Doubtful/i.test(inj)){ mu*=0.25; why='doubtful'; }
  else if(inj&&/^Questionable/i.test(inj)){ mu*=0.9; why='questionable'; }   // they miss the game about one time in ten
  let v=SD(mu)**2, locked=status!=='pre_game'&&status!=='bye';
  if(status==='complete'&&actual!=null){ mu=actual; v=0; }
  else if(status==='in_progress'&&actual!=null){ mu=actual+0.45*mu; v=v*0.35; }
  return {pid,name,pos,team,opp,status,locked,mu,v,why,inj,proj:mu};
}

/* ---------- best lineup (locks respected), then a variance nudge ---------- */
function bestLineup(slots, cur, pool){
  const out=slots.map(()=>null), used=new Set();
  slots.forEach((s,i)=>{ const p=cur[i]&&pool.get(cur[i]); if(p&&p.locked){ out[i]=p; used.add(p.pid); } });
  const order=slots.map((s,i)=>i).filter(i=>!out[i]).sort((a,b)=>(FLEXY.has(slots[a])?1:0)-(FLEXY.has(slots[b])?1:0)||ELIG[slots[a]].length-ELIG[slots[b]].length);
  for(const i of order){
    // a current starter keeps his spot unless someone beats him by at least half a point (no churn over noise)
    const keep=p=>p.mu+(cur.includes(p.pid)?0.5:0);
    const best=[...pool.values()].filter(p=>!used.has(p.pid)&&!p.locked&&(ELIG[slots[i]]||[]).includes(p.pos)).sort((a,b)=>keep(b)-keep(a))[0];
    if(best){ out[i]=best; used.add(best.pid); }
  }
  return out;
}
const tot=l=>l.reduce((a,p)=>({mu:a.mu+(p?p.mu:0),v:a.v+(p?p.v:0)}),{mu:0,v:0});
const wp=(m,o)=>Phi((m.mu-o.mu)/Math.sqrt(m.v+o.v||1));
function nudge(slots, line, pool, opp){
  // if the swing between two near-equal options changes your win chance, prefer the one that helps
  let cur=line.slice(), base=wp(tot(cur),opp), changed=[];
  for(let pass=0;pass<2;pass++){
    for(let i=0;i<slots.length;i++){ const a=cur[i]; if(!a||a.locked) continue;
      for(const b of pool.values()){ if(b.locked||cur.includes(b)||!(ELIG[slots[i]]||[]).includes(b.pos)||a.mu-b.mu>2) continue;
        const alt=cur.slice(); alt[i]=b; const w=wp(tot(alt),opp); if(w>base+0.005){ changed.push({out:a,in:b,gain:w-base}); cur=alt; base=w; } } }
  }
  return {line:cur,changed};
}

/* ---------- render ---------- */
function rowHtml(p,slot,right){
  if(!p) return `<div class="row"><span class="gm"><span class="pos ${slot}">${slot}</span></span><span class="body"><span class="t sub">empty</span></span></div>`;
  const tag=p.why?`<span class="tag ${p.mu===0?'bad':'wn'}">${esc(p.why)}</span>`:'';
  const lock=p.locked?`<span class="lock" title="Game has started">🔒</span>`:'';
  return `<div class="row"><span class="gm" style="min-width:44px"><span class="pos ${slot}">${slot==='FLEX'?'FLX':slot}</span></span>
    <span class="body"><span class="t"><span class="pos ${p.pos}">${p.pos}</span>${esc(p.name)}${tag}${lock}</span>
      <span class="s">${esc(p.team||'')} ${esc(p.opp||'· bye')}${p.status==='complete'?' · final':p.status==='in_progress'?' · playing':''}</span></span>
    <span class="dl">${right!=null?right:`<span class="pts">${p.mu.toFixed(1)}</span>`}</span></div>`;
}
function render(){
  const wk=S.week, slots=S.league.roster_positions.filter(x=>x!=='BN'&&x!=='IR'&&x!=='TAXI');
  $('#wk').textContent=`Week ${wk}`;
  const mine=S.mu.find(m=>m.roster_id===S.meRoster.roster_id);
  if(!mine){ $('#hero').innerHTML='<div class="note">No matchup for you this week.</div>'; ['#changes','#lineup','#bench','#vs'].forEach(x=>$(x).innerHTML=''); return; }
  const oppM=S.mu.find(m=>m.matchup_id===mine.matchup_id&&m.roster_id!==mine.roster_id);
  const oppR=oppM&&S.rosters.find(r=>r.roster_id===oppM.roster_id), oppName=oppR?(S.users[oppR.owner_id]||'Opponent'):'Bye week';
  const reserve=new Set(S.meRoster.reserve||[]);
  const pool=new Map(); for(const pid of (mine.players||[])) if(!reserve.has(pid)) pool.set(pid,playerInfo(pid,(mine.players_points||{})[pid]));
  const cur=(mine.starters||[]).map(x=>x&&x!=='0'?x:null);
  for(const pid of cur) if(pid&&!pool.has(pid)) pool.set(pid,playerInfo(pid,(mine.players_points||{})[pid]));
  const oppLine=oppM?(oppM.starters||[]).map(pid=>pid&&pid!=='0'?playerInfo(pid,(oppM.players_points||{})[pid]):null):[];
  const oT=oppM?tot(oppLine):{mu:0,v:0};
  const curLine=cur.map(pid=>pid?pool.get(pid):null);
  let best=bestLineup(slots,cur,pool);
  const nud=oppM?nudge(slots,best,pool,oT):{line:best,changed:[]};
  best=nud.line;
  const bT=tot(best), cT=tot(curLine), w=oppM?wp(bT,oT):null, wc=oppM?wp(cT,oT):null;
  $('#hero').innerHTML=`<div class="lbl">Week ${wk} vs ${esc(oppName)}</div>
    <div class="big">${w!=null?Math.round(w*100)+'%':'—'} <span style="font-size:15px;color:var(--dim);font-weight:650">chance to win with the best lineup</span></div>
    <div class="note">You ${bT.mu.toFixed(1)} · ${esc(oppName)} ${oT.mu.toFixed(1)} projected.${wc!=null&&Math.abs(w-wc)>0.005?` Your current Sleeper lineup: ${Math.round(wc*100)}% (${cT.mu.toFixed(1)} pts).`:' Your current Sleeper lineup is already the best one.'}</div>`;
  // changes vs Sleeper
  const curSet=new Set(cur.filter(Boolean)), bestSet=new Set(best.filter(Boolean).map(p=>p.pid));
  const ins=best.filter(p=>p&&!curSet.has(p.pid)).sort((a,b)=>b.mu-a.mu), outs=curLine.filter(p=>p&&!bestSet.has(p.pid)).sort((a,b)=>b.mu-a.mu);
  const emptyIdx=cur.map((x,i)=>x?null:i).filter(x=>x!=null);
  const pairs=ins.map((p,i)=>({in:p,out:outs[i]||null}));
  $('#chmeta').textContent=pairs.length?`${pairs.length} swap${pairs.length===1?'':'s'}`:'';
  $('#changes').innerHTML=pairs.length? pairs.map(x=>`<div class="swap"><div><span class="pos ${x.in.pos}">${x.in.pos}</span><span class="in">Start ${esc(x.in.name)}</span><div class="sub">${x.in.mu.toFixed(1)} pts${x.in.why?' · '+esc(x.in.why):''}</div></div>
        <div class="sub">for</div><div style="text-align:right">${x.out?`<span class="out">${esc(x.out.name)}</span><div class="sub">${x.out.mu.toFixed(1)} pts${x.out.why?' · '+esc(x.out.why):''}</div>`:'<span class="sub">an empty slot</span>'}</div></div>`).join('')
      +(nud.changed.length?`<div class="pad note">${nud.changed.map(c=>`<b>${esc(c.in.name)}</b> over ${esc(c.out.name)} is a ${w<0.5?'ceiling':'safety'} call: about the same points, but it raises your win chance by ${Math.round(c.gain*100)} point${Math.round(c.gain*100)===1?'':'s'}.`).join(' ')}</div>`:'')
    : `<div class="pad note">Nothing to change. ${emptyIdx.length?'':'Your Sleeper lineup is already the best one this week.'}</div>`;
  // lineup
  $('#lineup').innerHTML=slots.map((s,i)=>rowHtml(best[i],s)).join('');
  // bench
  const benchList=[...pool.values()].filter(p=>!best.includes(p)).sort((a,b)=>b.mu-a.mu);
  $('#bench').innerHTML=benchList.length?benchList.map(p=>{ const rivals=best.filter((b,i)=>b&&(ELIG[slots[i]]||[]).includes(p.pos)); const worst=rivals.sort((a,b)=>a.mu-b.mu)[0];
      const gap=worst?p.mu-worst.mu:null;
      return rowHtml(p,'BN',`<span class="pts">${p.mu.toFixed(1)}</span><br><span class="sub">${gap!=null?(gap>=0?'+':'')+gap.toFixed(1)+' vs '+esc(worst.name.split(' ').slice(-1)[0]):''}</span>`); }).join('')
    :'<div class="pad note">No one on the bench.</div>';
  // slot by slot
  $('#vsmeta').textContent=oppM?`you vs ${oppName}`:'';
  $('#vs').innerHTML=oppM? slots.map((s,i)=>{ const a=best[i], b=oppLine[i]; const d=(a?a.mu:0)-(b?b.mu:0);
      return `<div class="vsrow"><span class="pos ${s}">${s==='FLEX'?'FLX':s}</span><span class="nm">${a?esc(a.name):'—'} <b>${a?a.mu.toFixed(1):''}</b></span>
        <span class="mid ${d>1?'up':d<-1?'down':'sub'}">${d>0?'+':''}${d.toFixed(1)}</span><span class="nm" style="text-align:right"><b>${b?b.mu.toFixed(1):''}</b> ${b?esc(b.name):'—'}</span></div>`; }).join('')
      +`<div class="pad note">Green slots are where you have the edge. Their lineup is what's set in Sleeper right now, so it can still change before kickoff.</div>`
    : '<div class="pad note">No opponent this week.</div>';
  $('#method').innerHTML=`<p><b>Projections</b> are Sleeper's weekly projections, rescored under your league's exact scoring, with the same extras as your draft board (yardage bonuses, long plays, sacks taken, defensive pressure). Defences use their projected points allowed for this opponent.</p>
    <p><b>Win chance</b> treats each player's week as uncertain (bigger projections swing more) and compares your lineup's total with your opponent's current one. Games that are over count their real points; players in games under way are locked 🔒 and can't be moved, just like in Sleeper.</p>
    <p><b>Close calls:</b> when two players are within 2 points, it picks the one that helps your win chance: the boom-or-bust option when you're the underdog, the steadier one when you're favoured.</p>
    <p><b>Injuries:</b> Out, IR and suspended players count as zero; doubtful as a quarter of their projection; questionable is flagged but counted, so check news before kickoff.</p>
    <p class="sub">Build ${esc(BUILD)}.</p>`;
}

/* ---------- events ---------- */
function openSheet(title,html){ $('#stitle').textContent=title; $('#sbody').innerHTML=html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); }
$('#sdone').onclick=closeSheet; $('#scrim').onclick=closeSheet;
$('#tools').onclick=()=>openSheet('Your tools',`<div style="display:grid;gap:8px;margin-top:12px">
  <a class="btn" style="text-decoration:none;text-align:left;padding:14px;color:var(--tx)" href="../nhl-lineup/"><b>🏒 Weekly lineup</b><br><span class="sub">Yahoo hockey, set every Monday</span></a>
  <a class="btn pri" style="text-decoration:none;text-align:left;padding:14px" href="./"><b>🏈 Start/sit</b><br><span style="font-weight:500">Sleeper football, every week · you're here</span></a>
  <a class="btn" style="text-decoration:none;text-align:left;padding:14px;color:var(--tx)" href="../nhl/"><b>🥅 Hockey draft board</b><br><span class="sub">Yahoo hockey, 2026-27 draft</span></a>
  <a class="btn" style="text-decoration:none;text-align:left;padding:14px;color:var(--tx)" href="../"><b>🏈 Football draft board</b><br><span class="sub">Sleeper, Armchair Quarterbacks</span></a></div>`);
$('#refresh').onclick=()=>{ if(S.league) loadWeek().catch(e=>toast('Sleeper didn\'t answer')); else boot(); };
$('#prev').onclick=()=>{ if(!S.league||S.week<=1) return; S.week--; loadWeek().catch(()=>toast('Sleeper didn\'t answer')); };
$('#next').onclick=()=>{ if(!S.league||S.week>=18) return; S.week++; loadWeek().catch(()=>toast('Sleeper didn\'t answer')); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.league) loadWeek().catch(()=>{}); });
boot();
</script>
